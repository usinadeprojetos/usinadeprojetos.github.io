name: Atualizar dados do ClickUp

on:
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas (horário UTC)
  workflow_dispatch:         # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ler ClickUp e regerar dados.js
        run: node robo/atualizar.mjs
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      - name: Publicar se houve mudança
        run: |
          git config user.name "robo-usina"
          git config user.email "robo@usina.local"
          git add dados.js dados.json
          if git diff --cached --quiet; then echo "Sem mudanças"; else git commit -m "Atualiza dados do ClickUp ($(date -u +%Y-%m-%d\ %H:%M) UTC)" && git push; fi
