name: Atualizar dados do ClickUp

on:
  schedule:
    - cron: '7 1 * * *'      # todo dia às 22h07 (horário de Brasília = 01h07 UTC; fora da hora cheia, que o GitHub atrasa)
  workflow_dispatch:         # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ler ClickUp e regerar dados.js
        run: node robo/atualizar.mjs
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      - name: Ler Nextcloud (acervo e galeria)
        continue-on-error: true      # se o Nextcloud estiver fora do ar, o ClickUp ainda é publicado
        run: node robo/nextcloud.mjs
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_SENHA: ${{ secrets.NEXTCLOUD_SENHA }}
      - name: Gravar retrato do dia (histórico para os relatórios)
        run: node robo/historico.mjs
      - name: Publicar se houve mudança
        run: |
          git config user.name "robo-usina"
          git config user.email "robo@usina.local"
          mkdir -p img/galeria historico
          git add -A -- dados.js dados.json img/galeria historico
          if git diff --cached --quiet; then echo "Sem mudanças"; else git commit -m "Atualiza dados ($(date -u +%Y-%m-%d\ %H:%M) UTC)" && git push; fi
